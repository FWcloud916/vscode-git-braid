[workspace]
resolver = "2"
members = [
    "crates/core",
    "bindings/napi",
]

[workspace.package]
version      = "0.2.1"
edition      = "2021"
rust-version = "1.80"
authors      = ["Git Braid contributors"]
license      = "MIT"
repository   = "https://github.com/TBD/vscode-git-braid"

[workspace.dependencies]
# Core git reading — pure Rust, high-perf log walk (plan §3.3)
gix          = { version = "0.85", default-features = false, features = ["max-performance-safe", "revision", "blob-diff", "sha1"] }

# Data structures
smallvec = { version = "1", features = ["union", "const_generics"] }
bitflags = "2"

# Serialization (binary protocol, plan §3.5)
bytemuck = { version = "1", features = ["derive"] }

# napi-rs (plan §3.4 — native addon, host-side)
napi        = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"

# Testing / benchmarks
criterion = { version = "0.8", features = ["html_reports"] }
proptest  = "1"
