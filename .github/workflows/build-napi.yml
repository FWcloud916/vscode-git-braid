name: Build napi prebuilds

# Run this early to validate the CI matrix — per plan §9:
# "Validate CI prebuild matrix in M1, don't defer to the end."
on:
  workflow_call:  # reusable from publish.yml
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    paths:
      - "bindings/napi/**"
      - "crates/**"
      - "Cargo.toml"
      - ".github/workflows/build-napi.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.settings.target }})
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            build: |
              pnpm --filter @git-braid/native exec napi build --platform --release --dts _napi.d.ts.tmp --target aarch64-apple-darwin

          - host: macos-latest
            target: x86_64-apple-darwin
            build: |
              pnpm --filter @git-braid/native exec napi build --platform --release --dts _napi.d.ts.tmp --target x86_64-apple-darwin

          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: |
              pnpm --filter @git-braid/native exec napi build --platform --release --dts _napi.d.ts.tmp --target x86_64-unknown-linux-gnu

          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: |
              pnpm --filter @git-braid/native exec napi build --platform --release --dts _napi.d.ts.tmp --target x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native addon
        run: ${{ matrix.settings.build }}
        shell: bash

      - name: Upload prebuild
        uses: actions/upload-artifact@v7
        with:
          name: git-braid-native-${{ matrix.settings.target }}
          path: bindings/napi/*.node
          if-no-files-found: error
