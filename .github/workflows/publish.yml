name: Publish to VS Code Marketplace

# Triggered by a version tag push: git tag v0.1.0 && git push --tags
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # Phase 1 — Build all 4 platform .node binaries (reuses build-napi.yml).
  build-napi:
    uses: ./.github/workflows/build-napi.yml

  # Phase 2 — Package one .vsix per platform in parallel (no publish here).
  # vsce packaging is cross-platform (the .node is just a file being zipped).
  package:
    needs: build-napi
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - vsceTarget: darwin-arm64
            napiName: darwin-arm64
            rustTriple: aarch64-apple-darwin
          - vsceTarget: darwin-x64
            napiName: darwin-x64
            rustTriple: x86_64-apple-darwin
          - vsceTarget: linux-x64
            napiName: linux-x64-gnu
            rustTriple: x86_64-unknown-linux-gnu
          - vsceTarget: win32-x64
            napiName: win32-x64-msvc
            rustTriple: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Download the prebuilt .node for this platform.
      - name: Download native prebuild
        uses: actions/download-artifact@v8
        with:
          name: git-braid-native-${{ matrix.platform.rustTriple }}
          path: bindings/napi/

      # Safety: confirm the expected .node filename exists before packaging.
      - name: Verify .node filename
        run: |
          NODE_FILE="bindings/napi/git-braid-native.${{ matrix.platform.napiName }}.node"
          if [ ! -f "$NODE_FILE" ]; then
            echo "ERROR: expected $NODE_FILE — got:"
            ls bindings/napi/*.node
            exit 1
          fi
          echo "✓ $NODE_FILE present"

      # Build TS + populate native/ (vendor-native copies loader + .node).
      - name: Build and vendor native
        run: pnpm run build

      # Package the per-platform .vsix and upload as an artifact for the publish job.
      - name: Package .vsix
        run: |
          pnpm exec vsce package \
            --target ${{ matrix.platform.vsceTarget }} \
            --pre-release \
            --no-dependencies \
            -o git-braid-${{ matrix.platform.vsceTarget }}.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.platform.vsceTarget }}
          path: git-braid-${{ matrix.platform.vsceTarget }}.vsix
          retention-days: 30

  # Phase 3 — Publish all 4 .vsix files in a single vsce invocation.
  # Running publish in one process eliminates the race condition where parallel
  # legs each try to create the same version on the Marketplace simultaneously,
  # causing "The extension already exists" errors on the slower legs.
  publish:
    needs: package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Download all 4 platform .vsix files into the current directory.
      - name: Download all .vsix artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: vsix-*
          merge-multiple: true

      # Publish all platforms in one process — vsce creates the version once and
      # attaches each platform asset sequentially, no cross-process collision.
      - name: Publish to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          pnpm exec vsce publish \
            --pre-release \
            --packagePath \
              git-braid-darwin-arm64.vsix \
              git-braid-darwin-x64.vsix \
              git-braid-linux-x64.vsix \
              git-braid-win32-x64.vsix
